bookdown::gitbook:  
  css: style.css  
  split_by: chapter  
  config:  
    toc:  
      collapse: subsection  
      scroll_highlight: yes  
    download: ["pdf", "epub"]  
    search: yes  
    fontsettings:  
      theme: white  
      family: sans  
      size: 2  
    sharing:  
      facebook: yes  
      twitter: yes  
      linkedin: yes  
bookdown::pdf_book:  
  includes:  
    in_header: preamble.tex  
  latex_engine: xelatex  
  citation_package: natbib  
  keep_tex: yes  
bookdown::epub_book: default